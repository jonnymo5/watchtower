---
# Build Watchtower from THIS fork's source and push it to GHCR for the Unraid
# host (wolverine, x86_64). Supply-chain control: the image is compiled from
# this repository at the pushed commit (build/docker/Dockerfile.self-local),
# not from upstream's published images or upstream's git.
#
# This is a fork-only workflow; upstream's release workflows (GoReleaser,
# Docker Hub, signing) are disabled here. It is a separate file so syncing
# upstream never conflicts with it.
#
# Pushed tags:
#   ghcr.io/<owner>/watchtower:latest      — tracks main (Watchtower updates
#                                            itself on wolverine)
#   ghcr.io/<owner>/watchtower:sha-<hash>  — immutable, for rollback
#
# See deploy/unraid/README.md for the Unraid side.
name: unraid-image

on:
  push:
    branches: [main]
    paths:
      - cmd/**
      - pkg/**
      - internal/**
      - main.go
      - go.mod
      - go.sum
      - build/docker/Dockerfile.self-local
      - .github/workflows/unraid-image.yaml
  workflow_dispatch:

concurrency:
  group: unraid-image
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          cache: false # Disable to prevent cache poisoning
          go-version-file: go.mod

      - name: Run tests
        run: go test -timeout 60s ./...

  build-and-push:
    name: Build and push image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/watchtower
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-
          # Override the upstream source/url labels baked into the Dockerfile so
          # the image (and GHCR package) points at this fork.
          labels: |
            org.opencontainers.image.url=https://github.com/${{ github.repository }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}

      - name: Build image for testing
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: build/docker/Dockerfile.self-local
          platforms: linux/amd64
          load: true
          push: false
          tags: watchtower-testing
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test that the binary runs
        run: docker run --rm watchtower-testing --help > /dev/null

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Reuses the layers from the test build above; nothing is rebuilt.
      - name: Build and push image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: build/docker/Dockerfile.self-local
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Pushed image"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
